<style>:root{
  --violet:#6B3DF5; --violet-press:#5A2FE0; --deep:#1C1242;
  --a:#F0609E; --b:#35A2F2; --both:#6B3DF5;
  --soft-a:#FDE8F1; --soft-b:#E3F2FE; --soft-v:#EEE8FF;
  --bg:#F3F1FA; --card:#FFFFFF; --ink:#16112B; --muted:#7E7898; --line:#E7E2F4; --soft:#EFEBFA;
  --red:#E5484D; --red-soft:#FDEDEE;
  --r-card:24px; --r-btn:16px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0E0A1E; --card:#1A1531; --ink:#F2EFFC; --muted:#9F98BC; --line:#2B2448; --soft:#241D40;
    --deep:#2A1B66; --soft-a:#3A1C30; --soft-b:#15304A; --soft-v:#2A2156; --red-soft:#3B1D25;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{font-family:"Onest",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);
  font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
a{color:inherit}
.app{min-height:100vh;min-height:100dvh}
.red{color:var(--red)!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.text-left{text-align:left}

/* шапка */
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 14px) 20px 10px}
.top-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.top h1,.subhead h1{margin:0;font-size:32px;line-height:1.05;font-weight:800;letter-spacing:-.025em}
.top-date{font-size:17px;font-weight:500;color:var(--muted)}
.icon-btn{width:44px;height:44px;border-radius:14px;display:inline-grid;place-items:center;flex-shrink:0;text-decoration:none}
.icon-btn:active{background:var(--soft)}
.banner{margin:0 20px 8px;padding:10px 14px;border-radius:14px;background:var(--soft-v);color:var(--violet);font-size:14px;font-weight:500}
.main{padding:4px 16px calc(120px + env(safe-area-inset-bottom))}
.screen{max-width:640px;margin:0 auto}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:52px;padding:0 20px;border-radius:var(--r-btn);
  font-weight:600;font-size:16px;transition:background .15s,transform .1s}
.btn:active:not(:disabled){transform:scale(.98)}
.btn-primary{background:var(--violet);color:#fff}
.btn-primary:active:not(:disabled){background:var(--violet-press)}
.btn-soft{background:var(--soft);color:var(--violet)}
.btn-white{background:#fff;color:var(--deep);margin-top:16px}
.btn-block{width:100%;margin-top:10px}
.btn-sm{min-height:40px;padding:0 14px;font-size:15px;border-radius:12px}
.btn-square{width:52px;padding:0;flex-shrink:0}
.btn-danger-ghost{color:var(--red);background:transparent}
.btn-danger-ghost.is-armed{background:var(--red);color:#fff}
.link-btn{color:var(--violet);font-weight:600;font-size:15px;min-height:40px;padding:0 4px}
.link-btn.center{display:block;margin:0 auto 8px}
.center-block{text-align:center;margin-top:28px}

/* сегменты и чипы */
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px;margin:12px 0}
.seg button{flex:1;min-height:40px;border-radius:11px;font-weight:600;font-size:14px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(40,20,90,.1)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:4px -16px 12px;padding:2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 16px;border-radius:999px;background:var(--card);
  border:1.5px solid var(--line);font-size:15px;font-weight:500;white-space:nowrap;position:relative}
.chip.on{background:var(--violet);border-color:var(--violet);color:#fff}
.chip em{font-style:normal;font-size:12px;font-weight:700;background:var(--soft-v);color:var(--violet);border-radius:999px;padding:1px 7px}
.chip.on em{background:rgba(255,255,255,.25);color:#fff}
.chip-dashed{border-style:dashed;color:var(--violet)}
.chip-date input{position:absolute;inset:0;opacity:0;width:100%;height:100%}

/* поля */
.field-wrap{margin-top:18px}
.field-label{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:8px}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.input{width:100%;min-height:52px;border:0;border-radius:14px;background:var(--soft);padding:13px 16px;font-size:17px;color:var(--ink);
  -webkit-appearance:none;appearance:none}
.input::placeholder{color:var(--muted)}
.input:focus{outline:2px solid var(--violet);background:var(--card)}
.input-lg{font-size:19px;font-weight:500;min-height:58px}
textarea.input{min-height:90px;resize:vertical}
select.input{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;margin-top:8px}
.file{font-size:14px;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .field-wrap{min-width:0}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.add-line{display:flex;gap:8px;margin:12px 0}
.toggle-row{display:flex;gap:12px;align-items:flex-start;padding:14px 0 2px;font-weight:500}
.toggle-row input{width:24px;height:24px;accent-color:var(--violet);flex-shrink:0;margin:0}
.toggle-row small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.warn-box{background:var(--soft-v);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:14px}

/* выбор человека */
.who-picker{display:flex;flex-direction:column;gap:8px}
.who-picker button{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 14px;border-radius:14px;background:var(--soft);
  font-weight:600;text-align:left;border:2px solid transparent}
.who-picker button.on{border-color:var(--c);background:var(--card)}
.who-picker button.on::after{content:"";margin-left:auto;width:10px;height:10px;border-radius:50%;background:var(--c)}
.ava{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:700;flex-shrink:0;line-height:1}

/* герой «Сегодня» — единственный яркий акцент */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:22px 22px 20px;color:#fff;margin:6px 0 8px;
  background:radial-gradient(120% 90% at 100% 0%,rgba(240,96,158,.55) 0%,transparent 55%),
             radial-gradient(90% 90% at 0% 100%,rgba(53,162,242,.45) 0%,transparent 60%),var(--deep)}
.hero-hello{font-family:"Caveat",cursive;font-size:30px;line-height:1;opacity:.95}
.hero-big{font-size:40px;font-weight:800;letter-spacing:-.03em;margin-top:12px;line-height:1}
.hero-sub{opacity:.75;margin-top:4px}
.hero-bar{height:8px;border-radius:4px;background:rgba(255,255,255,.18);margin-top:16px;overflow:hidden}
.hero-bar div{height:100%;background:#fff;border-radius:4px;transition:width .3s}
.hero-people{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.hero-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500}
.hero-chip i{width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 1.5px rgba(255,255,255,.7)}

/* секции */
.sec{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:26px 4px 10px}
.sec-row{display:flex;align-items:baseline;justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
.faded{opacity:.6;margin-top:8px}
.tip{font-size:13px;color:var(--muted);text-align:center;margin:12px 0 0}
.card{background:var(--card);border-radius:var(--r-card)}

/* задача */
.swipe{position:relative;border-radius:20px;overflow:hidden}
.swipe-bg{position:absolute;inset:0;background:var(--violet);color:#fff;display:flex;align-items:center;gap:8px;padding-left:22px;font-weight:600}
.task{position:relative;display:flex;align-items:flex-start;background:var(--card);border-radius:20px;transition:transform .2s;touch-action:pan-y;min-height:64px}
.task-overdue{background:var(--red-soft)}
.check-hit{width:56px;min-height:64px;display:grid;place-items:center;flex-shrink:0}
.check{width:26px;height:26px;border-radius:50%;border:2.2px solid;display:grid;place-items:center;transition:background .15s}
.task-body{flex:1;min-width:0;text-align:left;padding:13px 0 13px}
.task-title{font-size:17px;font-weight:500;word-wrap:break-word}
.task-done .task-title{text-decoration:line-through;color:var(--muted)}
.imp{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:6px;background:var(--red);color:#fff;font-size:12px;font-weight:800;margin-right:6px;vertical-align:2px}
.task-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;color:var(--muted);margin-top:3px}
.mi{display:inline-flex;align-items:center;gap:3px}
.task-note{font-size:13px;color:var(--muted);margin-top:4px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.task-ava{padding:17px 14px 0 10px}

/* строка-карточка */
.row-card{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:12px 14px;text-align:left;color:var(--muted)}
.row-ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex-shrink:0}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;color:var(--ink)}
.row-main b{font-weight:600}
.row-main small{color:var(--muted);font-size:13px}

/* неделя */
.pager{display:flex;align-items:center;justify-content:space-between;margin:4px 0 8px}
.pager-title{display:flex;flex-direction:column;align-items:center;text-align:center}
.pager-title b{font-size:17px}
.pager-title span{font-size:14px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.stat{background:var(--card);border-radius:20px;padding:14px 12px}
.stat-num{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:8px;line-height:1}
.stat-num small{font-size:15px;color:var(--muted);font-weight:500}
.stat-label{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-stat{padding:16px;margin-bottom:4px}
.home-stat-title{font-weight:600;margin-bottom:10px}
.home-row{display:grid;grid-template-columns:80px 1fr 24px;align-items:center;gap:10px;margin-top:6px;font-size:14px}
.home-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.home-row b{text-align:right}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar div{height:100%;border-radius:4px;transition:width .3s}
.day{margin-top:22px}
.day-head{display:flex;align-items:center;gap:8px;margin:0 4px 8px}
.day-name{font-size:18px;font-weight:700}
.day-name.is-today{color:var(--violet)}
.day-date{color:var(--muted);font-size:15px}
.day-add{margin-left:auto;width:36px;height:36px;border-radius:12px;background:var(--soft);color:var(--violet);display:grid;place-items:center}
.day-free{color:var(--muted);font-size:14px;padding:14px 16px;border:1.5px dashed var(--line);border-radius:18px}

/* календарь */
.cal{display:grid;grid-template-columns:repeat(7,1fr);padding:10px 8px;row-gap:2px}
.cal-wd{text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding:4px 0 8px}
.cal-day{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50px;border-radius:14px;font-weight:500}
.cal-day.out{opacity:.3}
.cal-day.today span:first-child{color:var(--violet);font-weight:800}
.cal-day.sel{background:var(--violet);color:#fff}
.cal-day.sel span:first-child{color:#fff}
.dots{display:flex;gap:3px;height:6px;margin-top:4px}
.dots i{width:6px;height:6px;border-radius:50%}
.cal-day.sel .dots i{box-shadow:0 0 0 1.5px #fff}
.legend{display:flex;justify-content:center;gap:16px;margin:10px 0 0;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%}

/* списки: плитки */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.tile{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--card);border-radius:24px;padding:16px;min-height:150px}
.tile-text{display:flex;flex-direction:column;margin-top:auto;padding-top:14px;min-width:0}
.tile:first-child{grid-column:1 / -1;min-height:auto;flex-direction:row;align-items:center;gap:14px}
.tile:first-child .tile-text{margin-top:0;padding-top:0}
.tile-ic{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;flex-shrink:0}
.tone-violet .tile-ic{background:var(--soft-v);color:var(--violet)}
.tone-a .tile-ic{background:var(--soft-a);color:var(--a)}
.tone-b .tile-ic{background:var(--soft-b);color:var(--b)}
.tile-title{font-size:18px;font-weight:700}
.tile-sub{font-size:14px;color:var(--muted);margin-top:2px}
.subhead{padding:calc(env(safe-area-inset-top) + 6px) 0 4px}
.subhead-row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px}
.subhead .back{display:inline-flex;align-items:center;gap:2px;color:var(--violet);font-weight:600;min-height:44px;margin-left:-6px}
.subhead h1{margin-top:4px}

/* строки списков */
.list{overflow:hidden}
.list:empty{display:none}
.list.flat{background:var(--soft);border-radius:16px;margin-bottom:0}
.li{display:flex;align-items:center;min-height:60px;border-bottom:1px solid var(--line);padding-right:8px}
.li:last-child{border-bottom:0}
.li .check-hit{min-height:56px}
.li-main{flex:1;min-width:0;padding:10px 0;display:flex;flex-direction:column;word-wrap:break-word}
.li-main small{font-size:13px}
.li-done .li-main>div,.li-done .li-main:not(:has(div)){text-decoration:line-through;color:var(--muted)}
.li-end{display:flex;align-items:center;gap:2px;font-size:15px;white-space:nowrap}
.stars{display:flex;gap:2px;color:#F5B400;margin-top:6px}
.stars span{display:inline-grid;place-items:center;width:30px;height:30px;margin:-5px -3px}
.inline-form{padding:12px;margin-bottom:8px}
.row-btns{display:flex;gap:8px;margin-top:8px}
.row-btns .btn{flex:1}
.total{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;margin-bottom:4px}
.total b{font-size:22px;font-weight:800}

/* поездки */
.trip{text-align:left;padding:18px;display:block;width:100%}
.trip-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.trip-place{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:10px}
.trip-note{font-size:14px;color:var(--muted);margin-top:6px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.trip-pack{margin-top:12px}
.trip-pack small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.badge{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px}
.st-dream{background:var(--soft-a);color:var(--a)}
.st-plan{background:var(--soft-v);color:var(--violet)}
.st-booked{background:var(--soft-b);color:var(--b)}
.st-done{background:var(--soft);color:var(--muted)}

/* сертификаты */
.cert{text-align:left;padding:18px;display:block;width:100%;border:2px solid transparent}
.cert-hot{border-color:var(--a)}
.cert-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cert-name{font-size:19px;font-weight:700}
.cert-val{font-weight:700;color:var(--violet);white-space:nowrap}
.cert-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;font-size:14px;flex-wrap:wrap}
.cert-for{display:inline-flex;align-items:center;gap:6px;font-weight:500}

/* пустые состояния */
.empty{text-align:center;padding:36px 20px}
.empty-title{font-size:19px;font-weight:700}
.empty-text{color:var(--muted);margin:6px auto 16px;max-width:320px}

/* форма задачи */
.more-btn{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:52px;margin-top:18px;padding:0 16px;
  border-radius:14px;background:var(--soft);color:var(--violet);font-weight:600}
.more-btn svg{transition:transform .2s}
.wd-pick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.wd-pick button{min-height:44px;border-radius:12px;background:var(--soft);font-weight:600;font-size:14px}
.wd-pick button.on{background:var(--violet);color:#fff}
.inline-num{display:flex;align-items:center;gap:10px;margin-top:10px}
.inline-num .input{width:90px}

/* нижняя панель */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);
  border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;justify-content:center;
  font-size:11px;font-weight:500;color:var(--muted)}
.tabbar button.on{color:var(--violet);font-weight:700}
.tab-ic{position:relative;display:grid;place-items:center}
.tab-ic em{position:absolute;top:-5px;right:-12px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;
  font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--card)}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:25;width:62px;height:62px;border-radius:22px;
  background:var(--violet);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(107,61,245,.4)}
.fab:active{transform:scale(.95)}

/* шторка */
.sheet-wrap{position:fixed;inset:0;z-index:50}
.overlay{position:absolute;inset:0;background:rgba(14,8,40,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--card);border-radius:28px 28px 0 0;
  max-height:92vh;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:8px 20px calc(24px + env(safe-area-inset-bottom));animation:sheet-up .25s cubic-bezier(.2,.8,.3,1)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 6px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-head h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes sheet-up{from{transform:translateY(60px);opacity:.5}to{transform:none;opacity:1}}

/* вход */
.onb{max-width:420px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12vh) 24px 40px;display:flex;flex-direction:column;gap:10px}
.onb h1{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:8px 0 0;line-height:1.05}
.onb p{color:var(--muted);margin:0 0 14px}
.onb-mark{width:64px;height:64px;border-radius:20px;background:radial-gradient(circle at 30% 30%,var(--a) 0 36%,transparent 37%),
  radial-gradient(circle at 70% 70%,var(--b) 0 36%,transparent 37%),var(--violet)}
.who-big{display:flex;align-items:center;gap:14px;min-height:76px;border-radius:22px;padding:0 18px;color:#fff;font-size:22px;font-weight:700}
.who-big .ava{background:rgba(255,255,255,.25)!important}

.loading{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted)}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--violet);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:70;max-width:560px;margin:0 auto;
  background:var(--ink);color:var(--bg);border-radius:16px;padding:14px 16px;font-size:15px;font-weight:500;text-align:center}

@media (min-width:700px){.main{padding-left:24px;padding-right:24px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
